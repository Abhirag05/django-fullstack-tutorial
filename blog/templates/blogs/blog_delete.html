{% extends "index.html" %}

{% block content %}
    <h1>Delete Blog</h1>
    <p>Are you sure you want to delete the blog "{{ blog.title }}"?</p>
    <form method="post" action="{% url 'blog:blog_delete' blog.id %}">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
        <a href="{% url 'blog:blog_list' %}">Cancel</a>
    </form>
{% endblock %}
