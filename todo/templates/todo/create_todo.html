{% extends 'index.html' %}
{% block title %}Create Todo{% endblock title %}
{% block content %}
    {%if todo%}
    <h1>Update Todo</h1> 
    {% else %}
        <h1>Create Todo</h1>
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{% if todo %}{{ todo.title }}{% endif %}" required>
        <textarea id="description" name="description" required>{% if todo %}{{ todo.description }}{% endif %}</textarea>
        {% if todo %}
        <label for="completed">Completed:</label>
        <input type="checkbox" id="completed" name="completed" {% if todo.completed %}checked{% endif %}>
        <button type="submit">Update Todo</button>
        {% else %}
        <button type="submit">Create Todo</button>
        {% endif %}
    </form>
{% endblock content %}
