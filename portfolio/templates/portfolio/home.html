{% extends "index.html" %}
{% block title %}My portfolio{% endblock title %}
{% block content %}
{% load static %}
 <section class="hero">
    <h1>Welcome to My Portfolio</h1>    
 </section>
 <section class="projects">
    <h2>My Projects</h2>
    <ul>
        {% for project in projects %}
            <li>
                <h3>{{ project.title }}</h3>
                <p>{{ project.description }}</p>
            </li>
        {% endfor %}
    </ul>
 </section>


  
{% endblock content %}
